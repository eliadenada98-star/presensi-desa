<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Presensi Desa</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =========================
           BACKGROUND FOTO
        ========================= */

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.35)
                ),
                url("{{ url_for('static', filename='images/background.png') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            background-attachment: fixed;

            position: relative;
        }


        /* =========================
           OVERLAY
        ========================= */

        body::before {
            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    135deg,
                    rgba(20, 83, 45, 0.15),
                    rgba(0, 0, 0, 0.10)
                );

            pointer-events: none;

            z-index: 0;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;

            max-width: 430px;

            padding: 20px;

            position: relative;

            z-index: 2;
        }


        /* =========================
           KOTAK LOGIN TRANSPARAN
        ========================= */

        .card {

            width: 100%;

            /* TRANSPARAN */
            background: rgba(255, 255, 255, 0.18);

            /* EFEK KACA */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            /* BORDER KACA */
            border: 1px solid rgba(255, 255, 255, 0.45);

            border-radius: 24px;

            padding: 40px 35px 32px;

            /* BAYANGAN */
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.30);

        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            width: 85px;
            height: 85px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background:
                rgba(22, 163, 74, 0.90);

            border:
                2px solid rgba(255, 255, 255, 0.7);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 40px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);
        }


        /* =========================
           JUDUL
        ========================= */

        h1 {

            text-align: center;

            color: white;

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 8px;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.35);
        }


        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {

            text-align: center;

            color: rgba(255, 255, 255, 0.90);

            font-size: 14px;

            margin-bottom: 30px;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.3);
        }


        /* =========================
           ERROR
        ========================= */

        .error {

            background:
                rgba(220, 38, 38, 0.85);

            color: white;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 18px;
        }


        /* =========================
           LABEL
        ========================= */

        label {

            display: block;

            color: white;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.4);
        }


        /* =========================
           INPUT
        ========================= */

        input {

            width: 100%;

            height: 50px;

            padding: 0 15px;

            border-radius: 11px;

            border:
                1px solid
                rgba(255, 255, 255, 0.55);

            background:
                rgba(255, 255, 255, 0.18);

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        input::placeholder {

            color:
                rgba(255, 255, 255, 0.75);
        }


        input:focus {

            background:
                rgba(255, 255, 255, 0.25);

            border-color:
                white;

            box-shadow:
                0 0 0 3px
                rgba(255, 255, 255, 0.15);
        }


        /* =========================
           BUTTON LOGIN
        ========================= */

        button {

            width: 100%;

            height: 52px;

            margin-top: 5px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #15803d
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.25);
        }


        button:hover {

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(0, 0, 0, 0.30);
        }


        button:active {

            transform:
                translateY(0);
        }


        /* =========================
           PEMISAH
        ========================= */

        .divider {

            height: 1px;

            background:
                rgba(255, 255, 255, 0.35);

            margin:
                25px 0 20px;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            color:
                rgba(255, 255, 255, 0.90);

            font-size: 13px;

            line-height: 1.6;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.4);
        }


        .footer strong {

            color: white;
        }


        .info {

            text-align: center;

            margin-top: 8px;

            color:
                rgba(255, 255, 255, 0.65);

            font-size: 12px;
        }


        /* =========================
           RESPONSIVE HP
        ========================= */

        @media (max-width: 600px) {

            .container {

                padding: 15px;
            }

            .card {

                padding:
                    32px
                    25px
                    28px;
            }

            .logo {

                width: 75px;
                height: 75px;

                font-size: 35px;
            }

            h1 {

                font-size: 27px;
            }

        }

    </style>
</head>


<body>


    <div class="container">

        <div class="card">


            <!-- LOGO -->

            <div class="logo">
                🏛️
            </div>


            <!-- JUDUL -->

            <h1>
                Presensi Desa
            </h1>


            <div class="subtitle">
                Sistem Presensi Perangkat Desa
            </div>


            <!-- ERROR -->

            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <!-- FORM LOGIN -->

            <form
                method="POST"
                action="{{ url_for('login') }}"
            >


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN -->

                <button type="submit">
                    🔐 &nbsp; LOGIN
                </button>


            </form>


            <!-- PEMISAH -->

            <div class="divider"></div>


            <!-- FOOTER -->

            <div class="footer">

                <strong>
                    Pemerintah Desa
                </strong>

                <br>

                Sistem Informasi Presensi Perangkat Desa

            </div>


            <div class="info">

                © 2026 Pemerintah Desa

            </div>


        </div>

    </div>


</body>
</html>
