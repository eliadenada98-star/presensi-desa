<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ubah Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f1f5f9;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .card {
            width: 100%;

            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.10);
        }

        h1 {
            color: #166534;

            margin-top: 0;

            text-align: center;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin-bottom: 25px;
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #16a34a;

            color: white;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;
        }

        .success {
            background: #dcfce7;

            color: #166534;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #166534;

            text-decoration: none;
        }

    </style>

</head>

<body>


    <div class="card">

        <h1>
            🔐 Ubah Password
        </h1>

        <div class="subtitle">
            {{ session["nama"] }}
        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        {% if success %}

        <div class="success">
            {{ success }}
        </div>

        {% endif %}


        <form method="POST">


            <div class="group">

                <label>
                    Password Lama
                </label>

                <input
                    type="password"
                    name="password_lama"
                    required
                >

            </div>


            <div class="group">

                <label>
                    Password Baru
                </label>

                <input
                    type="password"
                    name="password_baru"
                    minlength="6"
                    required
                >

            </div>


            <div class="group">

                <label>
                    Konfirmasi Password Baru
                </label>

                <input
                    type="password"
                    name="konfirmasi"
                    minlength="6"
                    required
                >

            </div>


            <button type="submit">
                💾 Simpan Password
            </button>


        </form>


        <a
            href="{{ url_for('perangkat_dashboard') }}"
            class="back"
        >
            ← Kembali ke Dashboard
        </a>

    </div>


</body>

</html>
